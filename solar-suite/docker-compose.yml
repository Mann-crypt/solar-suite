services:
  solar-suite:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - AEROMAL_PASSWORD=${AEROMAL_PASSWORD}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data

volumes:
  caddy_data:
